<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator | Task 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="calculator" aria-label="Calculator">
      <div class="top">
        <span class="badge">TASK 2</span>
        <button id="themeBtn" class="theme-btn" aria-label="Toggle theme">☀</button>
      </div>

      <div class="display">
        <div id="expression" class="expression">0</div>
        <div id="preview" class="preview"></div>
        <div id="result" class="result">0</div>
      </div>

      <div class="keys">
        <button class="key utility" data-action="clear">AC</button>
        <button class="key utility" data-action="delete">DEL</button>
        <button class="key operator" data-value="÷">÷</button>
        <button class="key operator" data-value="×">×</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key operator" data-value="-">−</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key operator" data-value="+">+</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key equals" data-action="equals">=</button>

        <button class="key zero" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
      </div>

      <p class="hint">Keyboard supported • Enter = calculate • Esc = clear</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
